    <meta charset="UTF-8">

    <title>Panel Kontrol Operator Draft Pick</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #1a1a24; padding: 20px; font-family: 'Segoe UI', sans-serif; color: #fff; }
        .admin-box { max-width: 1400px; margin: 0 auto; background: #111115; border: 1px solid #22222a; padding: 25px; border-radius: 8px; }
        .row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 280px; background: #1c1c24; padding: 15px; border-radius: 6px; border: 1px solid #2d2d3a; }
        h1 { color: #fff; font-size: 24px; margin-top:0; border-bottom: 2px solid #333; padding-bottom: 10px; }
        h2 { margin-top: 0; color: #00cfff; font-size: 18px; border-bottom: 1px solid #2d2d3a; padding-bottom: 8px; }
        h3 { font-size: 14px; color: #ffaa00; margin-top: 15px; margin-bottom: 5px; }
        label { display: block; margin: 10px 0 5px; color: #aaa; font-size: 13px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; background: #050505; border: 1px solid #333344; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #00cfff; color: #050505; border: none; padding: 12px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 15px; font-size: 14px; text-transform: uppercase; transition: 0.2s; }
        button:hover { background: #009ec2; }
        .btn-timer { background: #ff2a6d; color: #fff; width: auto; margin-right: 5px; padding: 8px 15px; }
        .btn-timer:hover { background: #cc2255; }
        .btn-sm { padding: 6px 12px; font-size: 12px; width: auto; margin: 2px; }

        /* BO3 / BO5 Toggle */
        .toggle-group { display: flex; gap: 10px; margin: 10px 0; }
        .toggle-btn { padding: 8px 20px; border: 2px solid #333; border-radius: 6px; background: transparent; color: #aaa; cursor: pointer; font-weight: bold; transition: 0.2s; width: auto; margin: 0; }
        .toggle-btn.active-bo3 { border-color: #ffaa00; color: #ffaa00; background: rgba(255,170,0,0.1); }
        .toggle-btn.active-bo5 { border-color: #00cfff; color: #00cfff; background: rgba(0,207,255,0.1); }

        /* CSS KHUSUS UNTUK KUSTOM DROPDOWN HERO */
        .search-container { position: relative; width: 100%; }
        .dropdown-items { 
            position: absolute; top: 100%; left: 0; right: 0; 
            background: #252530; border: 1px solid #444; max-height: 150px; 
            overflow-y: auto; z-index: 999; border-radius: 0 0 4px 4px; 
        }
        .dropdown-item { padding: 8px; cursor: pointer; color: #fff; font-size: 13px; }
        .dropdown-item:hover { background: #00cfff; color: #000; }
        .image-preview-slot { 
            width: 100%; height: 40px; background: #0f0f14; 
            margin-top: 4px; border-radius: 4px; overflow: hidden; 
            display: flex; align-items: center; justify-content: center; border: 1px dashed #333;
        }
        .image-preview-slot img { height: 100%; width: auto; object-fit: contain; }

        /* Score Indicator Preview */
        .score-preview { display: flex; gap: 8px; align-items: center; margin: 8px 0; padding: 8px; background: #0a0a12; border-radius: 6px; }
        .score-dot { width: 24px; height: 24px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: #1A1A1A; border: 1.5px solid rgba(255,255,255,0.10); transition: 0.3s; }
        .score-dot.active-blue { background: #00E7FF; border-color: #00E7FF; box-shadow: 0 0 20px rgba(0,231,255,0.3); }
        .score-dot.active-red { background: #FF4D7A; border-color: #FF4D7A; box-shadow: 0 0 20px rgba(255,77,122,0.3); }
        .score-dot.inactive { opacity: 0.3; }
        .score-label-preview { font-size: 11px; color: #666; margin-right: 4px; }

        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .action-buttons button { width: auto; margin: 0; padding: 10px 18px; font-size: 13px; }
        .btn-reset { background: #db2777; color: #fff; }
        .btn-reset:hover { background: #b01d5f; }
        .btn-switch { background: #555; color: #fff; }
        .btn-switch:hover { background: #777; }
        .btn-send { background: #22c55e; color: #fff; }
        .btn-send:hover { background: #16a34a; }

        /* Responsive */
        @media (max-width: 768px) { .row { flex-direction: column; } .action-buttons { flex-direction: column; } .action-buttons button { width: 100%; } }
    </style>
</head>

// ============================================================
// VARIABLES
// ============================================================
let currentFormat = 'bo5'; // 'bo3' or 'bo5'
let countdownInterval = null;
let timeLeft = 30;

// ============================================================
// FORMAT TOGGLE (BO3 / BO5)
// ============================================================
function setFormat(format) {
    currentFormat = format;
    
    // Update tombol
    document.getElementById('btn-bo3').className = 'toggle-btn' + (format === 'bo3' ? ' active-bo3' : '');
    document.getElementById('btn-bo5').className = 'toggle-btn' + (format === 'bo5' ? ' active-bo5' : '');
    
    // Tampilkan/sembunyikan Win 3
    const blueWin3 = document.getElementById('blueWin3Label');
    const redWin3 = document.getElementById('redWin3Label');
    const previewBlue3 = document.getElementById('preview-blue-3');
    const previewRed3 = document.getElementById('preview-red-3');
    
    if (format === 'bo3') {
        blueWin3.style.display = 'none';
        redWin3.style.display = 'none';
        previewBlue3.style.display = 'none';
        previewRed3.style.display = 'none';
        // Uncheck checkbox 3 & 6
        document.getElementById('checkbox3').checked = false;
        document.getElementById('checkbox6').checked = false;
    } else {
        blueWin3.style.display = 'inline-block';
        redWin3.style.display = 'inline-block';
        previewBlue3.style.display = 'block';
        previewRed3.style.display = 'block';
    }
    
    updateScorePreview();
    pushDataToLocal();
}

// ============================================================
// SCORE PREVIEW UPDATE
// ============================================================
function updateScorePreview() {
    const format = currentFormat;
    const maxScore = format === 'bo3' ? 2 : 3;
    
    // Blue
    for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById(`preview-blue-${i}`);
        const checkbox = document.getElementById(`checkbox${i}`);
        if (dot) {
            if (i <= maxScore) {
                dot.style.display = 'block';
                dot.className = 'score-dot' + (checkbox.checked ? ' active-blue' : ' inactive');
            } else {
                dot.style.display = 'none';
            }
        }
    }
    
    // Red
    for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById(`preview-red-${i}`);
        const checkbox = document.getElementById(`checkbox${i+3}`);
        if (dot) {
            if (i <= maxScore) {
                dot.style.display = 'block';
                dot.className = 'score-dot' + (checkbox.checked ? ' active-red' : ' inactive');
            } else {
                dot.style.display = 'none';
            }
        }
    }
    
    pushDataToLocal();
}

// ============================================================
// DROPDOWN FILTER
// ============================================================
function filterDropdown(id) {
    const searchInput = document.getElementById(`search-${id}`).value.toLowerCase();
    const dropdownItems = document.getElementById(`dropdown-items-${id}`);
    dropdownItems.innerHTML = '';
    if(!searchInput) return;

    heroes
        .filter(hero => hero.name.toLowerCase().includes(searchInput))
        .forEach(hero => {
            const item = document.createElement('div');
            item.classList.add('dropdown-item');
            item.textContent = hero.name;
            item.onclick = () => selectHero(hero, id);
            dropdownItems.appendChild(item);
        });
}

function selectHero(hero, id) {
    const imageDisplay = document.getElementById(`image-display-${id}`);
    imageDisplay.innerHTML = `<img src="${hero.img}" alt="${hero.name}" style="height:100%;width:auto;object-fit:contain;">`;
    document.getElementById(`search-${id}`).value = hero.name;
    document.getElementById(`dropdown-items-${id}`).innerHTML = '';
    pushDataToLocal();
}

// ============================================================
// RESET FUNCTIONS
// ============================================================
function resetAllDropdowns() {
    for (let i = 1; i <= 20; i++) {
        document.getElementById(`search-${i}`).value = '';
        document.getElementById(`image-display-${i}`).innerHTML = '';
        document.getElementById(`dropdown-items-${i}`).innerHTML = '';
    }
}

function resetInputs() {
    for (let i = 1; i <= 10; i++) {
        document.getElementById('input' + i).value = '';
    }
}

function resetAllData() {
    if (!confirm('Reset semua data draft?')) return;
    resetAllDropdowns();
    resetInputs();
    
    document.getElementById('team1').value = 'BLUE TEAM';
    document.getElementById('team2').value = 'RED TEAM';
    document.getElementById('blueLogo').value = 'Assets/Logo/default-blue.png';
    document.getElementById('redLogo').value = 'Assets/Logo/default-red.png';
    document.getElementById('tournamentnamemid').value = 'GRAND FINAL';
    document.getElementById('blueFooter').value = 'MATCH 1';
    document.getElementById('redFooter').value = 'MATCH 1';
    
    for (let i = 1; i <= 6; i++) {
        document.getElementById('checkbox' + i).checked = false;
    }
    
    resetTimer();
    updateScorePreview();
    pushDataToLocal();
}

// ============================================================
// SWITCH FUNCTIONS
// ============================================================
function switchInputs() {
    for (let i = 1; i <= 5; i++) {
        const temp = document.getElementById('input' + i).value;
        document.getElementById('input' + i).value = document.getElementById('input' + (i + 5)).value;
        document.getElementById('input' + (i + 5)).value = temp;
    }
    pushDataToLocal();
}

function switchAll() {
    // Team names
    const t1 = document.getElementById('team1');
    const t2 = document.getElementById('team2');
    const tempName = t1.value; t1.value = t2.value; t2.value = tempName;

    // Logos
    const l1 = document.getElementById('blueLogo');
    const l2 = document.getElementById('redLogo');
    const tempLogo = l1.value; l1.value = l2.value; l2.value = tempLogo;

    // Scores
    const maxScore = currentFormat === 'bo3' ? 2 : 3;
    for (let i = 1; i <= maxScore; i++) {
        const cbBlue = document.getElementById('checkbox' + i);
        const cbRed = document.getElementById('checkbox' + (i + 3));
        const temp = cbBlue.checked;
        cbBlue.checked = cbRed.checked;
        cbRed.checked = temp;
    }

    // Bans & Picks (swap 1-10 with 11-20)
    for (let i = 1; i <= 10; i++) {
        const searchA = document.getElementById(`search-${i}`);
        const searchB = document.getElementById(`search-${i+10}`);
        const imgA = document.getElementById(`image-display-${i}`);
        const imgB = document.getElementById(`image-display-${i+10}`);
        
        const tempSearch = searchA.value;
        searchA.value = searchB.value;
        searchB.value = tempSearch;
        
        const tempImg = imgA.innerHTML;
        imgA.innerHTML = imgB.innerHTML;
        imgB.innerHTML = tempImg;
    }

    switchInputs();
    updateScorePreview();
    pushDataToLocal();
}

// ============================================================
// TIMER
// ============================================================
function startTimer() {
    clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
        timeLeft = parseInt(document.getElementById('timer-display').value);
        if(timeLeft > 0) {
            timeLeft--;
            document.getElementById('timer-display').value = timeLeft;
            pushDataToLocal();
        } else {
            clearInterval(countdownInterval);
        }
    }, 1000);
}

function pauseTimer() { clearInterval(countdownInterval); }
function resetTimer() {
    clearInterval(countdownInterval);
    timeLeft = 30;
    document.getElementById('timer-display').value = timeLeft;
    pushDataToLocal();
}

// ============================================================
// PUSH DATA TO SERVER (OBS)
// ============================================================
function pushDataToLocal() {
    const currentTimer = document.getElementById('timer-display').value;
    const maxScore = currentFormat === 'bo3' ? 2 : 3;
    
    const dataToUpdate = {
        blueName: document.getElementById('team1').value,
        redName: document.getElementById('team2').value,
        blueLogo: document.getElementById('blueLogo').value,
        redLogo: document.getElementById('redLogo').value,
        matchTitle: document.getElementById('tournamentnamemid').value,
        blueFooter: document.getElementById('blueFooter').value,
        redFooter: document.getElementById('redFooter').value,
        timerValue: currentTimer,
        isCritical: parseInt(currentTimer) <= 5,
        format: currentFormat
    };

    // Score (sesuai format)
    for (let i = 1; i <= 3; i++) {
        dataToUpdate[`blueWin${i}`] = i <= maxScore ? document.getElementById(`checkbox${i}`).checked : false;
        dataToUpdate[`redWin${i}`] = i <= maxScore ? document.getElementById(`checkbox${i+3}`).checked : false;
    }

    // Blue Bans (1-5)
    for (let i = 1; i <= 5; i++) {
        const img = document.getElementById(`image-display-${i}`).querySelector('img');
        dataToUpdate[`blueBan${i}`] = img ? img.getAttribute('src') : '';
    }

    // Blue Picks (6-10)
    for (let i = 1; i <= 5; i++) {
        const img = document.getElementById(`image-display-${i+5}`).querySelector('img');
        dataToUpdate[`bluePick${i}`] = img ? img.getAttribute('src') : '';
        dataToUpdate[`blueNick${i}`] = document.getElementById(`input${i}`).value;
    }

    // Red Bans (11-15)
    for (let i = 1; i <= 5; i++) {
        const img = document.getElementById(`image-display-${i+10}`).querySelector('img');
        dataToUpdate[`redBan${i}`] = img ? img.getAttribute('src') : '';
    }

    // Red Picks (16-20)
    for (let i = 1; i <= 5; i++) {
        const img = document.getElementById(`image-display-${i+15}`).querySelector('img');
        dataToUpdate[`redPick${i}`] = img ? img.getAttribute('src') : '';
        dataToUpdate[`redNick${i}`] = document.getElementById(`input${i+5}`).value;
    }

    socket.emit('updateDraft', dataToUpdate);
}

// ============================================================
// EVENT LISTENERS
// ============================================================
document.getElementById('btn-update-all').addEventListener('click', pushDataToLocal);

// Auto-send on any change
document.querySelectorAll('input, select').forEach(el => {
    el.addEventListener('change', pushDataToLocal);
    el.addEventListener('input', pushDataToLocal);
});

// ============================================================
// INIT
// ============================================================
setFormat('bo5');
pushDataToLocal();

// Expose functions ke global
window.filterDropdown = filterDropdown;
window.selectHero = selectHero;
window.resetAllDropdowns = resetAllDropdowns;
window.resetInputs = resetInputs;
window.switchInputs = switchInputs;
window.switchAll = switchAll;
window.resetAllData = resetAllData;
window.startTimer = startTimer;
window.pauseTimer = pauseTimer;
window.resetTimer = resetTimer;
window.pushDataToLocal = pushDataToLocal;
window.updateScorePreview = updateScorePreview;
window.setFormat = setFormat;
</script>
