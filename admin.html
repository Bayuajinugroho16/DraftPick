        body { background-color: #1a1a24; padding: 20px; font-family: sans-serif; color: #fff; }
        .admin-box { max-width: 1300px; margin: 0 auto; background: #111115; border: 1px solid #22222a; padding: 25px; border-radius: 8px; }
        .row { display: flex; gap: 20px; margin-bottom: 20px; }
        .col { flex: 1; background: #1c1c24; padding: 15px; border-radius: 6px; border: 1px solid #2d2d3a; }
        h2 { margin-top: 0; color: #00cfff; font-size: 18px; border-bottom: 1px solid #2d2d3a; padding-bottom: 8px; }
        h3 { font-size: 14px; color: #ffaa00; margin-top: 15px; margin-bottom: 5px; }
        label { display: block; margin: 10px 0 5px; color: #aaa; font-size: 13px; }
        input[type="text"] { width: 100%; padding: 8px; background: #050505; border: 1px solid #333344; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #00cfff; color: #050505; border: none; padding: 12px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 15px; font-size: 14px; text-transform: uppercase; }
        button:hover { background: #009ec2; }
        .btn-timer { background: #ff2a6d; color: #fff; width: auto; margin-right: 5px; padding: 8px 15px; }
        
        /* CSS KHUSUS UNTUK KUSTOM DROPDOWN HERO */
        .search-container { position: relative; width: 100%; }
        .dropdown-items { 
            position: absolute; top: 100%; left: 0; right: 0; 
            background: #252530; border: 1px solid #444; max-height: 150px; 
            overflow-y: auto; z-index: 999; border-radius: 0 0 4px 4px; 
        }
        .dropdown-item { padding: 8px; cursor: pointer; color: #fff; font-size: 13px; }
        .dropdown-item:hover { background: #00cfff; color: #000; }
        .image-preview-slot { 
            width: 100%; height: 40px; background: #0f0f14; 
            margin-top: 4px; border-radius: 4px; overflow: hidden; 
            display: flex; align-items: center; justify-content: center; border: 1px dashed #333;
        }
        .image-preview-slot img { height: 100%; width: auto; object-fit: contain; }
    </style>
</head>

            { name: 'Wanwan', img: 'Assets/HeroPick/wanwan.png' },
            { name: 'Xavier', img: 'Assets/HeroPick/xavier.png' },
            { name: 'Xborg', img: 'Assets/HeroPick/xborg.png' },
            { name: 'Yin', img: 'Assets/HeroPick/yin.png' },
            { name: 'Yisunshin', img: 'Assets/HeroPick/yisunshin.png' },
            { name: 'Yuzhong', img: 'Assets/HeroPick/yuzhong.png' },
            { name: 'Yve', img: 'Assets/HeroPick/yve.png' },
            { name: 'Zhask', img: 'Assets/HeroPick/zhask.png' },
            { name: 'Zhuxin', img: 'Assets/HeroPick/zhuxin.png' },
            { name: 'Zilong', img: 'Assets/HeroPick/zilong.png' }
        ];

        // Memperbaiki path database agar tidak memakai '/' di awal root (agar cocok dengan lokal Node.js)
        heroes.forEach(h => {
            if(h.img.startsWith('/')) h.img = h.img.substring(1);
        });

        // 1. FILTER DROPDOWN
        function filterDropdown(id) {
            const searchInput = document.getElementById(`search-${id}`).value.toLowerCase();
            const dropdownItems = document.getElementById(`dropdown-items-${id}`);
            dropdownItems.innerHTML = ''; 

            if(!searchInput) return;

            heroes
                .filter(hero => hero.name.toLowerCase().includes(searchInput))
                .forEach(hero => {
                    const item = document.createElement('div');
                    item.classList.add('dropdown-item');
                    item.textContent = hero.name;
                    item.onclick = () => selectHero(hero, id);
                    dropdownItems.appendChild(item);
                });
        }

        // 2. SELEKSI HERO DENGAN ANIMASI
        function selectHero(hero, id) {
            const imageDisplay = document.getElementById(`image-display-${id}`);
            const existingImage = imageDisplay.querySelector('img');

            if (existingImage) {
                existingImage.classList.add('fly-out');
                setTimeout(() => { updateHeroImage(hero, id); }, 200);
            } else {
                updateHeroImage(hero, id);
            }
        }

        function updateHeroImage(hero, id) {
            const imageDisplay = document.getElementById(`image-display-${id}`);
            imageDisplay.innerHTML = `<img src="${hero.img}" alt="${hero.name}" class="fly-in">`;
            document.getElementById(`search-${id}`).value = hero.name;
            document.getElementById(`dropdown-items-${id}`).innerHTML = ''; 
            
            // Otomatis kirim data langsung ke OBS sesaat setelah memilih Hero
            pushDataToLocal();
        }

        // 3. RESET DROPDOWNS
        function resetAllDropdowns() {
            for (let i = 1; i <= 20; i++) {
                const imageDisplay = document.getElementById(`image-display-${i}`);
                if (imageDisplay && imageDisplay.innerHTML) {
                    const img = imageDisplay.querySelector('img');
                    if(img) img.classList.add('fly-out');
                }

                setTimeout(() => {
                    if(document.getElementById(`search-${i}`)) document.getElementById(`search-${i}`).value = '';
                    if(imageDisplay) imageDisplay.innerHTML = '';
                    if(document.getElementById(`dropdown-items-${i}`)) document.getElementById(`dropdown-items-${i}`).innerHTML = '';
                }, 200);
            }
        }

        // 4. RESET NICKNAMES & INPUT TEKS
        function updateOutput() { /* Real-time sync via button broadcast */ }
        function resetInputs() {
            for (let i = 1; i <= 10; i++) {
                document.getElementById('input' + i).value = '';
            }
        }

        function switchInputs() {
            for (let i = 1; i <= 5; i++) {
                const temp = document.getElementById('input' + i).value;
                document.getElementById('input' + i).value = document.getElementById('input' + (i + 5)).value;
                document.getElementById('input' + (i + 5)).value = temp;
            }
            pushDataToLocal();
        }

        function updateTeamName() {}
        function toggleImage(imageId) { pushDataToLocal(); }

        function resetContent() {
            document.getElementById('team1').value = "BLUE TEAM";
            document.getElementById('team2').value = "RED TEAM";
            document.getElementById('checkbox1').checked = false;
            document.getElementById('checkbox2').checked = false;
            document.getElementById('checkbox3').checked = false;
            document.getElementById('checkbox4').checked = false;
            pushDataToLocal();
        }

        function switchAll() {
            // Tukar Nama Tim
            const t1 = document.getElementById('team1');
            const t2 = document.getElementById('team2');
            const tempName = t1.value; t1.value = t2.value; t2.value = tempName;

            // Tukar Logo
            const l1 = document.getElementById('blueLogo');
            const l2 = document.getElementById('redLogo');
            const tempLogo = l1.value; l1.value = l2.value; l2.value = tempLogo;

            // Tukar Score Win Tracker
            const cb1 = document.getElementById('checkbox1').checked;
            const cb2 = document.getElementById('checkbox2').checked;
            document.getElementById('checkbox1').checked = document.getElementById('checkbox3').checked;
            document.getElementById('checkbox2').checked = document.getElementById('checkbox4').checked;
            document.getElementById('checkbox3').checked = cb1;
            document.getElementById('checkbox4').checked = cb2;

            // Tukar Input Pencarian & Preview Image (ID 1-10 ditukar dengan 11-20)
            for(let i=1; i<=10; i++) {
                const searchA = document.getElementById(`search-${i}`);
                const searchB = document.getElementById(`search-${i+10}`);
                const imgA = document.getElementById(`image-display-${i}`);
                const imgB = document.getElementById(`image-display-${i+10}`);

                const tempSearchVal = searchA.value;
                searchA.value = searchB.value;
                searchB.value = tempSearchVal;

                const tempImgHtml = imgA.innerHTML;
                imgA.innerHTML = imgB.innerHTML;
                imgB.innerHTML = tempImgHtml;
            }

            // Tukar Nickname Player
            switchInputs();
        }

        // ==========================================================================
        // TIMER ENGINE 
        // ==========================================================================
        let countdownInterval = null;
        let timeLeft = 30;

        function startTimer() {
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                timeLeft = parseInt(document.getElementById('timer-display').value);
                if(timeLeft > 0) {
                    timeLeft--;
                    document.getElementById('timer-display').value = timeLeft;
                    pushDataToLocal();
                } else {
                    clearInterval(countdownInterval);
                    triggerAutoPick();
                }
            }, 1000);
        }

        function pauseTimer() { clearInterval(countdownInterval); }
        function resetTimer() {
            clearInterval(countdownInterval);
            timeLeft = 30;
            document.getElementById('timer-display').value = timeLeft;
            pushDataToLocal();
        }

        function triggerAutoPick() {
            let slotDitemukan = false;
            for (let id = 1; id <= 20; id++) {
                const inputSearch = document.getElementById(`search-${id}`);
                const imageDisplay = document.getElementById(`image-display-${id}`);

                if (inputSearch && (inputSearch.value.trim() === "" || !imageDisplay.innerHTML)) {
                    const randomIndex = Math.floor(Math.random() * heroes.length);
                    const randomHero = heroes[randomIndex];
                    selectHero(randomHero, id);
                    slotDitemukan = true;
                    break;
                }
            }
            if (!slotDitemukan) {
                alert("Semua slot Pick dan Ban sudah terisi penuh!");
                return;
            }
            resetTimer();
            startTimer();
        }

        // ==========================================================================
        // WEBSOCKET BROADCAST CONNECTOR (PENGIRIM UTAMA DATA KE OBS)
        // ==========================================================================
        function pushDataToLocal() {
            const currentTimer = document.getElementById('timer-display').value;
            
            const dataToUpdate = {
                blueName: document.getElementById('team1').value,
                redName: document.getElementById('team2').value,
                blueLogo: document.getElementById('blueLogo').value,
                redLogo: document.getElementById('redLogo').value,
                matchTitle: document.getElementById('tournamentnamemid').value,
                blueFooter: document.getElementById('blueFooter').value,
                redFooter: document.getElementById('redFooter').value,
                timerValue: currentTimer,
                isCritical: parseInt(currentTimer) <= 5,

                blueWin1: document.getElementById('checkbox1').checked,
                blueWin2: document.getElementById('checkbox2').checked,
                redWin1: document.getElementById('checkbox3').checked,
                redWin2: document.getElementById('checkbox4').checked
            };

            // Mapping ID 1-5 ke blueBan1-5, ID 6-10 ke bluePick1-5
            for(let i=1; i<=5; i++) {
                const imgBanBlue = document.getElementById(`image-display-${i}`).querySelector('img');
                dataToUpdate[`blueBan${i}`] = imgBanBlue ? imgBanBlue.getAttribute('src') : "";
                
                const imgPickBlue = document.getElementById(`image-display-${i+5}`).querySelector('img');
                dataToUpdate[`bluePick${i}`] = imgPickBlue ? imgPickBlue.getAttribute('src') : "";
                dataToUpdate[`blueNick${i}`] = document.getElementById(`input${i}`).value;
            }

            // Mapping ID 11-15 ke redBan1-5, ID 16-20 ke redPick1-5
            for(let i=1; i<=5; i++) {
                const imgBanRed = document.getElementById(`image-display-${i+10}`).querySelector('img');
                dataToUpdate[`redBan${i}`] = imgBanRed ? imgBanRed.getAttribute('src') : "";

                const imgPickRed = document.getElementById(`image-display-${i+15}`).querySelector('img');
                dataToUpdate[`redPick${i}`] = imgPickRed ? imgPickRed.getAttribute('src') : "";
                dataToUpdate[`redNick${i}`] = document.getElementById(`input${i+5}`).value;
            }

            // Tembakkan langsung ke Node.js lokal
            socket.emit('updateDraft', dataToUpdate);
        }

        // Pasang event listener ke tombol hijau kirim data
        document.getElementById('btn-update-all').addEventListener('click', pushDataToLocal);
    </script>
</body>
</html>
