<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esports Broadcast Overlay - Futuristic Cyber Minimalist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay-container">
    <div class="vignette-shadow"></div>

    <div class="side-block blue-block">
        <div class="ban-row">
            <div class="ban1"><div id="image-display-6" class="image-display"></div></div>
            <div class="ban1"><div id="image-display-7" class="image-display"></div></div>
            <div class="ban1"><div id="image-display-8" class="image-display"></div></div>
            <div class="ban1"><div id="image-display-9" class="image-display"></div></div>
            <div class="ban1"><div id="image-display-10" class="image-display"></div></div>
        </div>
        
        <div class="team-header">
            <div class="teamnameblue">
                <div class="team-name-display" id="teamNameDisplay1">SMAN 2</div>
            </div>
            <div class="bluelogo">
                <div class="image-container">
                    <img id="image1" src="Assets/Other/maskot-blue.png" alt="Logo" onclick="swapContent()">
                </div>
            </div>
        </div>

        <div class="pick-row id-blue-picks">
            <div class="pick1">
                <div id="image-display-1" class="image-display"></div>
                <div class="nameholder"><p id="output1"></p></div>
            </div>
            <div class="pick1">
                <div id="image-display-2" class="image-display"></div>
                <div class="nameholder"><p id="output2"></p></div>
            </div>
            <div class="pick1">
                <div id="image-display-3" class="image-display"></div>
                <div class="nameholder"><p id="output3"></p></div>
            </div>
            <div class="pick1">
                <div id="image-display-4" class="image-display"></div>
                <div class="nameholder"><p id="output4"></p></div>
            </div>
            <div class="pick1">
                <div id="image-display-5" class="image-display"></div>
                <div class="nameholder"><p id="output5"></p></div>
            </div>
        </div>
        
        <div class="strip-bawah">
            <div class="footer-text">SISFO CUP 2026 PRESENTED</div>
        </div>
    </div>

    <div class="tournamentinfo">
        <div class="tournamentlogo"> 
            <img class="logoprop" src="Assets/Other/tournamentlogo.png" alt="SISFO CUP LOGO">
        </div>

        <div class="timer-container" id="id-timer">
            <div id="timer-display">30</div>
        </div>

        <div class="match-info-box">
            <span class="ornamen-slash">///</span>
            <div class="tournamentname">
                <p id="tournamentnameOutput" class="tournamentnamemid">GROUP STAGE</p>
            </div>
            <span class="ornamen-slash">///</span>
        </div>

        <div class="vslogo-container">
            <p class="by-text">BY TAKAPEDIA</p>
        </div>

        <div class="winlose">
            <div class="win1">
                <div class="w"><div class="wimg"><img id="extraImage1" src="Assets/Other/win.png" alt="W"></div></div>
                <div class="w"><div class="wimg"><img id="extraImage2" src="Assets/Other/win.png" alt="W"></div></div>
                <div class="w"><div class="wimg"><img id="extraImage3" src="Assets/Other/win.png" alt="W"></div></div>
            </div>
            <div class="midwin"></div>
            <div class="win1">
                <div class="w"><div class="wimg"><img id="extraImage4" src="Assets/Other/win.png" alt="W"></div></div>
                <div class="w"><div class="wimg"><img id="extraImage5" src="Assets/Other/win.png" alt="W"></div></div>
                <div class="w"><div class="wimg"><img id="extraImage6" src="Assets/Other/win.png" alt="W"></div></div>
            </div>
        </div>
    </div>

    <div class="side-block red-block">
        <div class="ban-row red-ban">
            <div class="ban1"><div id="image-display-20" class="image-display"></div></div>
            <div class="ban1"><div id="image-display-19" class="image-display"></div></div>
            <div class="ban1"><div id="image-display-18" class="image-display"></div></div>
            <div class="ban1"><div id="image-display-17" class="image-display"></div></div>
            <div class="ban1"><div id="image-display-16" class="image-display"></div></div>
        </div>

        <div class="team-header red-header">
            <div class="redlogo">
                <div class="image-container">
                    <img id="image2" src="Assets/Other/maskot-red.png" alt="Logo" onclick="swapContent()">
                </div>
            </div>
            <div class="teamnamered">
                <div class="team-name-display" id="teamNameDisplay2">SMAN 2</div>
            </div>
        </div>

        <div class="pick-row id-red-picks">
            <div class="pick1">
                <div id="image-display-11" class="image-display"></div>
                <div class="nameholder"><p id="output6"></p></div>
            </div>
            <div class="pick1">
                <div id="image-display-12" class="image-display"></div>
                <div class="nameholder"><p id="output7"></p></div>
            </div>
            <div class="pick1">
                <div id="image-display-13" class="image-display"></div>
                <div class="nameholder"><p id="output8"></p></div>
            </div>
            <div class="pick1">
                <div id="image-display-14" class="image-display"></div>
                <div class="nameholder"><p id="output9"></p></div>
            </div>
            <div class="pick1">
                <div id="image-display-15" class="image-display"></div>
                <div class="nameholder"><p id="output10"></p></div>
            </div>
        </div>
        
        <div class="strip-bawah">
            <div class="footer-text text-kanan">SISFO CUP 2026 PRESENTED</div>
        </div>
    </div>
</div>

<div class="control-panel-section">
    <div class="control">
        <h1>CONTROL PANEL</h1>
        <button class="controlbutton" onclick="resetAllDropdowns()">Reset Pick</button>
        <button class="controlbutton" onclick="resetInputs()">Reset Nick</button>
        <button class="controlbutton" onclick="switchInputs()">Switch Nickname</button>
        <button class="controlbutton" onclick="switchAll()">Switch Team</button>
        <button class="controlbutton" onclick="resetContent()">Reset All</button>
        
        <button class="controlbutton" style="border-color: #00cfff;" onclick="startTimer()">▶ Start Timer</button>
        <button class="controlbutton" style="border-color: #ff2a6d;" onclick="pauseTimer()">⏸ Pause</button>
        <button class="controlbutton" style="border-color: #777;" onclick="resetTimer()">🔄 Reset Timer</button>

        <button class="controlbutton" style="background-color: #1a1a1a; border-color: #ffd700;" onclick="toggleVisibility('countdown')">👁 Hide/Show Detik</button>
        <button class="controlbutton" style="background-color: #22142b; border-color: #9d4edd;" onclick="toggleVisibility('timer')">👁 Hide/Show Container Timer</button>
        <button class="controlbutton" style="background-color: #0c1f44; border-color: #00cfff;" onclick="toggleVisibility('blue-picks')">👁 Hide/Show Blue Picks</button>
        <button class="controlbutton" style="background-color: #5a1026; border-color: #ff2a6d;" onclick="toggleVisibility('red-picks')">👁 Hide/Show Red Picks</button>
        
        <input type="text" id="tournamentnamemid" class="tournamentnamebox" placeholder="Ubah Status Match...">
    </div>

    <div class="allcontrol">
        <div class="control-group">
            <h2>Blue Side Settings</h2>
            <input type="text" id="team1" placeholder="Nama Tim Blue" oninput="updateTeamName()">
            <input type="file" id="file1" accept="image/*" onchange="loadImage(event, 'image1')">
            <div class="nick-inputs">
                <label>1 <input type="text" id="input1" oninput="updateOutput()"></label>
                <label>2 <input type="text" id="input2" oninput="updateOutput()"></label>
                <label>3 <input type="text" id="input3" oninput="updateOutput()"></label>
                <label>4 <input type="text" id="input4" oninput="updateOutput()"></label>
                <label>5 <input type="text" id="input5" oninput="updateOutput()"></label>
            </div>
            <div class="checkbox-container">
                <h4>Blue Win Count:</h4>
                <label><input type="checkbox" id="checkbox1" onclick="toggleImage('extraImage1')"> 1</label>
                <label><input type="checkbox" id="checkbox2" onclick="toggleImage('extraImage2')"> 2</label>
                <label><input type="checkbox" id="checkbox3" onclick="toggleImage('extraImage3')"> 3</label>
            </div>
            <div class="bluesidepick">
                <h3>Picks & Bans Selection</h3>
                <div class="dropdown-container"><input type="text" id="search-1" class="dropdown" placeholder="Pick 1" oninput="filterDropdown(1)"><div id="dropdown-items-1" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-2" class="dropdown" placeholder="Pick 2" oninput="filterDropdown(2)"><div id="dropdown-items-2" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-3" class="dropdown" placeholder="Pick 3" oninput="filterDropdown(3)"><div id="dropdown-items-3" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-4" class="dropdown" placeholder="Pick 4" oninput="filterDropdown(4)"><div id="dropdown-items-4" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-5" class="dropdown" placeholder="Pick 5" oninput="filterDropdown(5)"><div id="dropdown-items-5" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-6" class="dropdown" placeholder="Ban 1" oninput="filterDropdown(6)"><div id="dropdown-items-6" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-7" class="dropdown" placeholder="Ban 2" oninput="filterDropdown(7)"><div id="dropdown-items-7" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-8" class="dropdown" placeholder="Ban 3" oninput="filterDropdown(8)"><div id="dropdown-items-8" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-9" class="dropdown" placeholder="Ban 4" oninput="filterDropdown(9)"><div id="dropdown-items-9" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-10" class="dropdown" placeholder="Ban 5" oninput="filterDropdown(10)"><div id="dropdown-items-10" class="dropdown-items"></div></div>
            </div>
        </div>

        <div class="control-group">
            <h2>Red Side Settings</h2>
            <input type="text" id="team2" placeholder="Nama Tim Red" oninput="updateTeamName()">
            <input type="file" id="file2" accept="image/*" onchange="loadImage(event, 'image2')">
            <div class="nick-inputs">
                <label>1 <input type="text" id="input6" oninput="updateOutput()"></label>
                <label>2 <input type="text" id="input7" oninput="updateOutput()"></label>
                <label>3 <input type="text" id="input8" oninput="updateOutput()"></label>
                <label>4 <input type="text" id="input9" oninput="updateOutput()"></label>
                <label>5 <input type="text" id="input10" oninput="updateOutput()"></label>
            </div>
            <div class="checkbox-container">
                <h4>Red Win Count:</h4>
                <label><input type="checkbox" id="checkbox4" onclick="toggleImage('extraImage4')"> 1</label>
                <label><input type="checkbox" id="checkbox5" onclick="toggleImage('extraImage5')"> 2</label>
                <label><input type="checkbox" id="checkbox6" onclick="toggleImage('extraImage6')"> 3</label>
            </div>
            <div class="redesidepick">
                <h3>Picks & Bans Selection</h3>
                <div class="dropdown-container"><input type="text" id="search-11" class="dropdown" placeholder="Pick 1" oninput="filterDropdown(11)"><div id="dropdown-items-11" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-12" class="dropdown" placeholder="Pick 2" oninput="filterDropdown(12)"><div id="dropdown-items-12" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-13" class="dropdown" placeholder="Pick 3" oninput="filterDropdown(13)"><div id="dropdown-items-13" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-14" class="dropdown" placeholder="Pick 4" oninput="filterDropdown(14)"><div id="dropdown-items-14" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-15" class="dropdown" placeholder="Pick 5" oninput="filterDropdown(15)"><div id="dropdown-items-15" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-16" class="dropdown" placeholder="Ban 1" oninput="filterDropdown(16)"><div id="dropdown-items-16" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-17" class="dropdown" placeholder="Ban 2" oninput="filterDropdown(17)"><div id="dropdown-items-17" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-18" class="dropdown" placeholder="Ban 3" oninput="filterDropdown(18)"><div id="dropdown-items-18" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-19" class="dropdown" placeholder="Ban 4" oninput="filterDropdown(19)"><div id="dropdown-items-19" class="dropdown-items"></div></div>
                <div class="dropdown-container"><input type="text" id="search-20" class="dropdown" placeholder="Ban 5" oninput="filterDropdown(20)"><div id="dropdown-items-20" class="dropdown-items"></div></div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
