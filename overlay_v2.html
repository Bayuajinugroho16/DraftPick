<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISFO CUP Overlay V2</title>
    <link rel="stylesheet" href="overlay_v2.css">
</head>

<body>

<div class="overlay-wrapper">

    <div class="overlay-frame">

        <!-- FX Layer -->
        <div class="light-sweep"></div>
        <div class="vignette"></div>
        <div class="noise"></div>

        <!-- Corner -->
        <div class="frame-corner tl"></div>
        <div class="frame-corner tr"></div>
        <div class="frame-corner bl"></div>
        <div class="frame-corner br"></div>

        <!-- ===================== -->
        <!-- BLUE SIDE -->
        <!-- ===================== -->

        <section class="team-side blue-side">

            <div class="diamond"></div>
            <div class="tech-line"></div>

            <div class="team-header">

                <div class="team-title">
                    <div class="team-name-display" id="view-blue-name">BLUE TEAM</div>
                    <div class="team-subtitle">SISFO CUP 2026</div>
                </div>

                <div class="team-logo">
                    <img id="view-blue-logo" src="Assets/Logo/default-blue.png">
                </div>

            </div>

            <!-- BANS -->
            <div class="ban-row">
                <div class="ban-slot"><img id="view-blue-ban-1"></div>
                <div class="ban-slot"><img id="view-blue-ban-2"></div>
                <div class="ban-slot"><img id="view-blue-ban-3"></div>
                <div class="ban-slot"><img id="view-blue-ban-4"></div>
                <div class="ban-slot"><img id="view-blue-ban-5"></div>
            </div>

            <!-- HERO PICKS -->
            <div class="pick-row">

                <div class="hero-card">
                    <div class="hero-image"><img id="view-blue-pick-1"></div>
                    <div class="hero-player"><span id="view-blue-nick-1">PLAYER</span></div>
                </div>

                <div class="hero-card">
                    <div class="hero-image"><img id="view-blue-pick-2"></div>
                    <div class="hero-player"><span id="view-blue-nick-2">PLAYER</span></div>
                </div>

                <div class="hero-card">
                    <div class="hero-image"><img id="view-blue-pick-3"></div>
                    <div class="hero-player"><span id="view-blue-nick-3">PLAYER</span></div>
                </div>

                <div class="hero-card">
                    <div class="hero-image"><img id="view-blue-pick-4"></div>
                    <div class="hero-player"><span id="view-blue-nick-4">PLAYER</span></div>
                </div>

                <div class="hero-card">
                    <div class="hero-image"><img id="view-blue-pick-5"></div>
                    <div class="hero-player"><span id="view-blue-nick-5">PLAYER</span></div>
                </div>

            </div>

            <div class="bottom-info">
                <div class="footer-left" id="view-blue-footer">MATCH 1</div>
            </div>

        </section>

        <!-- ================= -->
        <!-- CENTER -->
        <!-- ================= -->

        <section class="center-panel">

            <div class="center-glow"></div>
            <div class="hex"></div>
            <div class="hex"></div>

            <div class="tournament-logo">
                <img src="Assets/Other/tournamentlogo.png">
            </div>

            <div class="timer-box">
                <div id="timer-display">30</div>
            </div>

            <div class="match-title">
                <span id="view-match-title">GRAND FINAL</span>
            </div>

            <!-- ===== SCORE WRAPPER BEST OF 3 / BEST OF 5 ===== -->
            <div class="score-wrapper">

                <!-- Blue Score (kiri) -->
                <div class="score-side blue-score-side" id="blueScoreSide">
                    <div class="score-bar" id="view-blue-win-1"></div>
                    <div class="score-bar" id="view-blue-win-2"></div>
                    <div class="score-bar" id="view-blue-win-3"></div>
                </div>

                <div class="score-divider"></div>

                <!-- Red Score (kanan) -->
                <div class="score-side red-score-side" id="redScoreSide">
                    <div class="score-bar" id="view-red-win-1"></div>
                    <div class="score-bar" id="view-red-win-2"></div>
                    <div class="score-bar" id="view-red-win-3"></div>
                </div>

            </div>

        </section>

        <!-- ================= -->
        <!-- RED SIDE -->
        <!-- ================= -->

        <section class="team-side red-side">
            <div class="diamond"></div>
            <div class="tech-line"></div>

            <div class="team-header">

                <div class="team-logo">
                    <img id="view-red-logo" src="Assets/Logo/default-red.png">
                </div>

                <div class="team-title align-right">
                    <div class="team-name-display" id="view-red-name">RED TEAM</div>
                    <div class="team-subtitle">SISFO CUP 2026</div>
                </div>

            </div>

            <!-- BANS -->
            <div class="ban-row red-ban">
                <div class="ban-slot"><img id="view-red-ban-1"></div>
                <div class="ban-slot"><img id="view-red-ban-2"></div>
                <div class="ban-slot"><img id="view-red-ban-3"></div>
                <div class="ban-slot"><img id="view-red-ban-4"></div>
                <div class="ban-slot"><img id="view-red-ban-5"></div>
            </div>

            <!-- HERO PICKS -->
            <div class="pick-row">

                <div class="hero-card">
                    <div class="hero-image"><img id="view-red-pick-1"></div>
                    <div class="hero-player"><span id="view-red-nick-1">PLAYER</span></div>
                </div>

                <div class="hero-card">
                    <div class="hero-image"><img id="view-red-pick-2"></div>
                    <div class="hero-player"><span id="view-red-nick-2">PLAYER</span></div>
                </div>

                <div class="hero-card">
                    <div class="hero-image"><img id="view-red-pick-3"></div>
                    <div class="hero-player"><span id="view-red-nick-3">PLAYER</span></div>
                </div>

                <div class="hero-card">
                    <div class="hero-image"><img id="view-red-pick-4"></div>
                    <div class="hero-player"><span id="view-red-nick-4">PLAYER</span></div>
                </div>

                <div class="hero-card">
                    <div class="hero-image"><img id="view-red-pick-5"></div>
                    <div class="hero-player"><span id="view-red-nick-5">PLAYER</span></div>
                </div>

            </div>

            <div class="bottom-info">
                <div class="footer-right" id="view-red-footer">MATCH 1</div>
            </div>

        </section>

    </div>
    <!-- END overlay-frame -->

    <!-- SPONSOR LOGO - Di luar overlay-frame -->
    <div style="position:absolute; right: 885px; bottom: 40px; z-index: 100; text-align:center;">
    <div style="font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:5px; color:#9e9e9e; margin-bottom:-5px;">SPONSOR BY</div>
    <img src="http://localhost:3000/sponsor.png" alt="Sponsor" 
         style="width:150px; height:50px; object-fit:contain;">
</div>

</div>
<!-- END overlay-wrapper -->

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

// ============================================================
// DATA SEBELUMNYA UNTUK DETEKSI PERUBAHAN
// ============================================================
let previousData = {};

// ============================================================
// ANIMASI PICK HERO (Fade In Sederhana)
// ============================================================
function triggerHeroAnimation(slotId, heroName) {
    const img = document.getElementById(slotId);
    if (!img || !img.src || img.src === '') return;
    
    const heroCard = img.closest('.hero-card');
    if (!heroCard) return;
    
    // Reset animasi
    img.style.animation = 'none';
    void img.offsetWidth;
    
    // Fade in sederhana
    img.style.animation = 'simpleFadeIn 1.5s ease forwards';
    img.style.opacity = '0';
    
    // Glow flash di card (subtle)
    heroCard.classList.remove('picked');
    void heroCard.offsetWidth;
    heroCard.classList.add('picked');
    
    // Hapus class setelah selesai
    setTimeout(() => {
        heroCard.classList.remove('picked');
        img.style.animation = '';
        img.style.opacity = '1';
    }, 1600);
}

function triggerBanAnimation(slotId) {
    const img = document.getElementById(slotId);
    if (!img) return;
    const banSlot = img.closest('.ban-slot');
    if (!banSlot) return;
    
    // Reset animasi
    img.style.animation = 'none';
    void img.offsetWidth;
    
    // Fade in ban
    img.style.animation = 'banFadeIn 1.4s ease forwards';
    img.style.opacity = '0';
    
    banSlot.classList.remove('filled');
    void banSlot.offsetWidth;
    banSlot.classList.add('filled');
    
    setTimeout(() => {
        img.style.animation = '';
        img.style.opacity = '1';
    }, 1600);
}

// ============================================================
// RENDER DATA UTAMA
// ============================================================
function renderData(data) {
    if (!data) return;

    // === DETEKSI PERUBAHAN PICK ===
    for (let i = 1; i <= 5; i++) {
        const bluePickId = `view-blue-pick-${i}`;
        const redPickId = `view-red-pick-${i}`;
        
        const bluePickOld = previousData[`bluePick${i}`];
        const redPickOld = previousData[`redPick${i}`];
        const bluePickNew = data[`bluePick${i}`];
        const redPickNew = data[`redPick${i}`];
        
        if (bluePickNew && bluePickNew !== bluePickOld) {
            const img = document.getElementById(bluePickId);
            if (img) {
                img.src = bluePickNew;
                setTimeout(() => triggerHeroAnimation(bluePickId, bluePickNew), 50);
            }
        }
        if (redPickNew && redPickNew !== redPickOld) {
            const img = document.getElementById(redPickId);
            if (img) {
                img.src = redPickNew;
                setTimeout(() => triggerHeroAnimation(redPickId, redPickNew), 50);
            }
        }
    }
    
    // === DETEKSI PERUBAHAN BAN ===
    for (let i = 1; i <= 5; i++) {
        const blueBanId = `view-blue-ban-${i}`;
        const redBanId = `view-red-ban-${i}`;
        
        const blueBanOld = previousData[`blueBan${i}`];
        const redBanOld = previousData[`redBan${i}`];
        const blueBanNew = data[`blueBan${i}`];
        const redBanNew = data[`redBan${i}`];
        
        if (blueBanNew && blueBanNew !== blueBanOld) {
            const img = document.getElementById(blueBanId);
            if (img) {
                img.src = blueBanNew;
                setTimeout(() => triggerBanAnimation(blueBanId), 50);
            }
        }
        if (redBanNew && redBanNew !== redBanOld) {
            const img = document.getElementById(redBanId);
            if (img) {
                img.src = redBanNew;
                setTimeout(() => triggerBanAnimation(redBanId), 50);
            }
        }
    }
    
    // === UPDATE DATA SEBELUMNYA ===
    previousData = { ...data };

    // === TEAM NAMES ===
    document.getElementById("view-blue-name").innerText = data.blueName || "BLUE TEAM";
    document.getElementById("view-red-name").innerText = data.redName || "RED TEAM";

    // === FOOTER ===
    document.getElementById("view-blue-footer").innerText = data.blueFooter || "MATCH 1";
    document.getElementById("view-red-footer").innerText = data.redFooter || "MATCH 1";

    // === MATCH TITLE ===
    document.getElementById("view-match-title").innerText = data.matchTitle || "GRAND FINAL";

    // === LOGOS ===
    document.getElementById("view-blue-logo").src = data.blueLogo || "Assets/Logo/default-blue.png";
    document.getElementById("view-red-logo").src = data.redLogo || "Assets/Logo/default-red.png";

    // === TIMER ===
    const timer = document.getElementById("timer-display");
    timer.innerText = data.timerValue || "30";
    
    if (data.isCritical) {
        timer.classList.add("critical");
    } else {
        timer.classList.remove("critical");
    }

    // ============================================================
    // === SCORE BAR - BEST OF 3 / BEST OF 5 ===
    // ============================================================
    const format = data.format || 'bo5';
    const maxScore = format === 'bo3' ? 2 : 3;
    
    // Update Blue Score (1-3)
    for (let i = 1; i <= 3; i++) {
        const scoreBar = document.getElementById(`view-blue-win-${i}`);
        if (scoreBar) {
            if (i > maxScore) {
                scoreBar.style.display = 'none';
                scoreBar.classList.remove('active');
            } else {
                scoreBar.style.display = 'block';
                const isActive = data[`blueWin${i}`] === true;
                scoreBar.classList.toggle('active', isActive);
            }
        }
    }
    
    // Update Red Score (1-3)
    for (let i = 1; i <= 3; i++) {
        const scoreBar = document.getElementById(`view-red-win-${i}`);
        if (scoreBar) {
            if (i > maxScore) {
                scoreBar.style.display = 'none';
                scoreBar.classList.remove('active');
            } else {
                scoreBar.style.display = 'block';
                const isActive = data[`redWin${i}`] === true;
                scoreBar.classList.toggle('active', isActive);
            }
        }
    }

    // === BANS ===
    for (let i = 1; i <= 5; i++) {
        const blueBan = document.getElementById(`view-blue-ban-${i}`);
        const redBan = document.getElementById(`view-red-ban-${i}`);
        
        if (blueBan && !blueBan.src) blueBan.src = data[`blueBan${i}`] || "";
        if (redBan && !redBan.src) redBan.src = data[`redBan${i}`] || "";
    }

    // === PICKS & NICKNAMES ===
    for (let i = 1; i <= 5; i++) {
        const bluePick = document.getElementById(`view-blue-pick-${i}`);
        const redPick = document.getElementById(`view-red-pick-${i}`);
        const blueNick = document.getElementById(`view-blue-nick-${i}`);
        const redNick = document.getElementById(`view-red-nick-${i}`);
        
        if (bluePick && !bluePick.src) bluePick.src = data[`bluePick${i}`] || "";
        if (redPick && !redPick.src) redPick.src = data[`redPick${i}`] || "";
        if (blueNick) blueNick.innerText = data[`blueNick${i}`] || "-";
        if (redNick) redNick.innerText = data[`redNick${i}`] || "-";
    }
}

// ============================================================
// SOCKET EVENTS
// ============================================================
socket.on("initData", renderData);
socket.on("pushToOverlay", renderData);

</script>

</body>
</html>
